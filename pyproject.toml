[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "evalkit"
version = "0.1.0"
description = "A readable, reproducible LLM evaluation harness: log-likelihood and generative benchmarks, sandboxed code execution, LLM-as-judge, and paired significance tests."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kishor Hange" }]
dependencies = ["numpy>=1.24", "pyyaml>=6.0"]

[project.optional-dependencies]
# Local GPU inference with Hugging Face models.
hf = ["torch>=2.1", "transformers>=4.45", "accelerate>=0.30", "datasets>=2.18"]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "tokenizers>=0.19"]

[project.scripts]
evalkit = "evalkit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 140
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501", "B905", "SIM905", "SIM105", "SIM108"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
